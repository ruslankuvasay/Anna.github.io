html<form id="pollForm">
  <label>Имя: <input type="text" id="username" required></label><br>
  <label>Возраст: <input type="number" id="age" required></label><br>
  <label>Оценка сервиса:
    <select id="rating">
      <option value="Отлично">Отлично</option>
      <option value="Хорошо">Хорошо</option>
      <option value="Плохо">Плохо</option>
    </select>
  </label><br>
  <button type="submit">Отправить</button>
</form>

<table border="1" id="resultTable">
  <thead>
    <tr>
      <th>Имя</th>
      <th>Возраст</th>
      <th>Оценка</th>
    </tr>
  </thead>
  <tbody>
    <!-- Данные будут добавляться сюда -->
  </tbody>
</table>
